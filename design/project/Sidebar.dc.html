<span style="flex: 1">{{g.label}}</span></a>
</sc-if>

function phaseRange(items) {
  const ps = items.map(function (i) { return i.phase; }).filter(function (p) { return p !== 'P1'; });
  const uniq = ps.filter(function (p, i) { return ps.indexOf(p) === i; });
  return uniq.length === 1 ? uniq[0] : uniq[0] + '+';
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const active = (props && props.active) || 'dashboard';
    const open = {};
    NAV.forEach(function (g) {
      if (g.items && g.items.some(function (i) { return i.id === active; })) open[g.id] = true;
    });
    this.state = { role: 'admin', open: open, collapsed: !!(props && props.collapsed), narrow: false };
  }

  componentDidMount() {
    const self = this;
    this.onResize = function () {
      const narrow = window.innerWidth < 760;
      if (narrow !== self.state.narrow) self.setState(narrow ? { narrow: true, collapsed: true } : { narrow: false });
    };
    try { window.addEventListener('resize', this.onResize); } catch (e) { /* no window events */ }
    this.onResize();
  }

  componentWillUnmount() {
    try { window.removeEventListener('resize', this.onResize); } catch (e) { /* no window events */ }
  }

  renderVals() {
    const self = this;
    const s = this.state;
    const active = this.props.active || 'dashboard';
    const visible = NAV.filter(function (g) { return s.role === 'admin' || g.depts.indexOf(s.role) !== -1; });

    const groups = visible.map(function (g) {
      const items = (g.items || []).map(function (it) {
        const live = !!it.href;
        const current = it.id === active;
        return Object.assign({}, it, {
          live: live,
          locked: !live,
          currentAttr: current ? 'page' : 'false',
          bg: current ? '#DCE0F7' : 'transparent',
          rail: current ? '#3D4BC7' : 'transparent',
          weight: current ? 600 : 400,
          hasSub: !!it.sub,
          hasMore: !!it.more,
          hasCount: !!it.count,
          countBg: it.countTone === 'alert' ? '#D83A52' : '#DCDFEC',
          countInk: it.countTone === 'alert' ? '#FFFFFF' : '#323338',
          phaseLong: PHASE_LONG[it.phase] || it.phase,
          tip: 'Coming soon',
          go: function () { try { window.localStorage.setItem('flyland-nav', it.id || ''); } catch (e) { /* storage blocked */ } }
        });
      });
      const liveCount = items.filter(function (i) { return i.live; }).length;
      const allLocked = !g.single && liveCount === 0;
      const hasActive = g.single ? g.itemId === active : items.some(function (i) { return i.id === active; });
      const open = !!s.open[g.id];
      return Object.assign({}, g, {
        items: items,
        single: !!g.single,
        multi: !g.single,
        total: items.length,
        liveCount: liveCount,
        someLive: !g.single && liveCount > 0 && liveCount < items.length,
        allLocked: allLocked,
        phase: allLocked ? phaseRange(items) : '',
        hasNote: !!g.note,
        open: open,
        rot: open ? 180 : 0,
        opacity: allLocked ? 0.7 : 1,
        currentAttr: hasActive ? 'page' : 'false',
        bg: hasActive ? '#DCE0F7' : 'transparent',
        ink: hasActive ? '#283277' : '#323338',
        railBg: hasActive ? '#DCE0F7' : 'transparent',
        railInk: hasActive ? '#283277' : '#323338',
        railAria: g.label + (allLocked ? ', coming soon' : '') + '. Open in sidebar',
        toggle: function () {
          const next = Object.assign({}, self.state.open);
          next[g.id] = !open;
          self.setState({ open: next });
        },
        openFromRail: function () {
          if (g.single) { self.setState({ collapsed: false }); return; }
          const next = Object.assign({}, self.state.open);
          next[g.id] = true;
          self.setState({ collapsed: false, open: next });
        }
      });
    });

    return {
      width: s.narrow ? '100%' : s.collapsed ? '60px' : '272px',
      railDir: s.narrow ? 'row' : 'column',
      expanded: !s.collapsed,
      isCollapsed: s.collapsed,
      collapse: function () { self.setState({ collapsed: true }); },
      expand: function () { self.setState({ collapsed: false }); },
      role: s.role,
      roleNote: 'Showing ' + ROLE_NOTE[s.role],
      onRole: function (e) {
        const role = e.target.value;
        const next = Object.assign({}, self.state.open);
        if (role !== 'admin') {
          NAV.forEach(function (g) { if (!g.single && g.depts.indexOf(role) !== -1) next[g.id] = true; });
        }
        self.setState({ role: role, open: next });
      },
      groups: groups
    };
  }
}
</script>
</body>
</html>
